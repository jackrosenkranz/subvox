name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm:
    name: core + desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SUBVOX_ANDROID: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :desktop:test :desktop:installDist --no-daemon
      - run: ./gradlew :desktop:run --args="--help" --no-daemon

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    env:
      SUBVOX_ANDROID: "on"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :android:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: subvox-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
